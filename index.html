  <script type="text/babel-src" id="app-src">
    const { useState, useMemo, useEffect } = React;

    /* ---------- localStorage 持久化 ---------- */
    const LS_KEYS = { days: 'travel.days.v3', expenses: 'travel.expenses.v3' };

    function loadLS(key) {
      try {
        const raw = window.localStorage.getItem(key);
        return raw == null ? undefined : JSON.parse(raw);
      } catch (e) { return undefined; }
    }
    function saveLS(key, val) {
      try { window.localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
    }
    function usePersistentState(key, initializer) {
      const [state, setState] = useState(() => {
        const stored = loadLS(key);
        if (stored !== undefined) return stored;
        return typeof initializer === 'function' ? initializer() : initializer;
      });
      useEffect(() => { saveLS(key, state); }, [key, state]);
      return [state, setState];
    }
    function resetAllData() {
      try {
        window.localStorage.removeItem(LS_KEYS.days);
        window.localStorage.removeItem(LS_KEYS.expenses);
      } catch (e) {}
      window.location.reload();
    }

    /* ---------- lucide 圖示 React 包裝 ---------- */
    function Icon({ name, size = 20, className = '', strokeWidth = 1.75, style }) {
      const node = window.lucide && window.lucide.icons && window.lucide.icons[name];
      if (!node) return null;
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size}
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
          className={className} style={style}>
          {node.map((child, i) => React.createElement(child[0], { key: i, ...child[1] }))}
        </svg>
      );
    }

    /* ---------- 唯一 id 產生器 ---------- */
    let _uid = 1000;
    const uid = () => (++_uid);

    /* ---------- 交通方式 ---------- */
    // 可選項（依需求：移除「纜車」「電車」；新增「計程車」「自行車」；「巴士」改名「公車」）
    const TRANSPORT_KEYS = ['步行', '公車', '地鐵', '火車', '計程車', '自行車', '船', '飛機'];
    // 依交通方式字串推斷對應 Icon（同時支援組合字與既有資料的舊名稱）
    function transportIcon(mode) {
      const m = mode || '';
      if (m.includes('飛機')) return 'Plane';
      if (m.includes('計程車')) return 'Car';
      if (m.includes('自行車') || m.includes('單車') || m.includes('腳踏車')) return 'Bike';
      if (m.includes('纜車')) return 'CableCar';
      if (m.includes('船') || m.includes('遊船')) return 'Ship';
      if (m.includes('火車')) return 'TrainFront';
      if (m.includes('地鐵') || m.includes('U-Bahn') || m.includes('U4')) return 'TrainFront';
      if (m.includes('電車') || m.includes('S-Bahn') || m.includes('快線') || m.includes('CAT')) return 'TramFront';
      if (m.includes('公車') || m.includes('巴士')) return 'Bus';
      if (m.includes('步行')) return 'Footprints';
      return 'Navigation';
    }

    /* ---------- Google Maps 連結 ---------- */
    function mapHref(map) {
      const s = (map || '').trim();
      if (!s) return '';
      if (/^https?:\/\//i.test(s)) return s;
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s);
    }

    /* ---------- Open-Meteo 天氣整合 ---------- */
    const TRIP_YEAR = 2026;
    // 各城市經緯度（依每日對應城市推斷）
    const GEO = [
      { keys:['慕尼黑','München','Munich'], lat:48.137, lon:11.575, name:'慕尼黑' },
      { keys:['薩爾斯堡','Salzburg'],       lat:47.809, lon:13.055, name:'薩爾斯堡' },
      { keys:['哈修塔特','Hallstatt'],      lat:47.562, lon:13.649, name:'哈修塔特' },
      { keys:['維也納','Wien','Vienna'],     lat:48.208, lon:16.373, name:'維也納' },
      { keys:['桃園','台北','台灣','桃園'],   lat:25.038, lon:121.565, name:'台北' },
    ];
    function resolveGeo(day) {
      const s = (day.city || '') + '｜' + (day.lodging || '');
      for (const g of GEO) { if (g.keys.some(k => s.includes(k))) return g; }
      return null;
    }
    function isMMDD(d) { return /^\d{2}\/\d{2}$/.test(d || ''); }
    function toISODate(mmdd) {
      const [mm, dd] = mmdd.split('/');
      return `${TRIP_YEAR}-${mm}-${dd}`;
    }
    // WMO Weathercode → { icon, desc }
    function wmoToWeather(code) {
      if (code === 0) return { icon:'Sun', desc:'晴朗' };
      if (code === 1) return { icon:'Sun', desc:'大致晴朗' };
      if (code === 2) return { icon:'CloudSun', desc:'部分多雲' };
      if (code === 3) return { icon:'Cloud', desc:'陰天' };
      if (code === 45 || code === 48) return { icon:'CloudFog', desc:'有霧' };
      if (code >= 51 && code <= 57) return { icon:'CloudDrizzle', desc:'毛毛雨' };
      if (code >= 61 && code <= 67) return { icon:'CloudRain', desc:'降雨' };
      if (code >= 71 && code <= 77) return { icon:'CloudSnow', desc:'降雪' };
      if (code >= 80 && code <= 82) return { icon:'CloudRain', desc:'陣雨' };
      if (code === 85 || code === 86) return { icon:'CloudSnow', desc:'陣雪' };
      if (code >= 95) return { icon:'CloudLightning', desc:'雷雨' };
      return { icon:'Cloud', desc:'多雲' };
    }

    const ITINERARY = [

    // 依當日城市 + 日期，向 Open-Meteo 取得即時天氣；失敗則 fallback 靜態資料
    function useDayWeather(day) {
      const [wx, setWx] = useState(() => ({ ...day.weather, source: 'static', loading: false }));
      useEffect(() => {
        const geo = resolveGeo(day);
        if (!geo || !isMMDD(day.date)) {
          setWx({ ...day.weather, source: 'static', loading: false });
          return;
        }
        let ignore = false;
        setWx(w => ({ ...w, loading: true }));
        const dateStr = toISODate(day.date);
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}` +
          `&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`;
        fetch(url)
          .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
          .then(d => {
            if (ignore) return;
            const dl = d && d.daily;
            if (dl && dl.time && dl.time.length && dl.weathercode && dl.weathercode[0] != null) {
              const w = wmoToWeather(dl.weathercode[0]);
              setWx({
                icon: w.icon, desc: w.desc,
                high: Math.round(dl.temperature_2m_max[0]),
                low: Math.round(dl.temperature_2m_min[0]),
                source: 'live', loading: false,
              });
            } else {
              setWx({ ...day.weather, source: 'static', loading: false });
            }
          })
          .catch(() => { if (!ignore) setWx({ ...day.weather, source: 'static', loading: false }); });
        return () => { ignore = true; };
      }, [day.id]);
      return wx;
    }

            <div className="min-w-0">
              <div className="flex items-center gap-1.5 text-[11px] font-medium text-sage-600">
                <Icon name="BedDouble" size={13} /> 今晚住宿 · {info.range}
              </div>
              <div className="mt-1 font-semibold text-ink-800 leading-snug">{info.hotel}</div>
              <div className="mt-0.5 text-[12.5px] text-ink-500 flex items-center gap-1">
                <Icon name="MapPin" size={12} className="text-oat-500" /> {info.country} · {info.city}
              </div>
            </div>
            <a href={info.url} target="_blank" rel="noopener noreferrer"
              className="shrink-0 inline-flex items-center gap-1.5 rounded-xl border border-sage-500/40 bg-sage-500/10 px-3 py-2 text-[12.5px] font-medium text-sage-700 hover:bg-sage-500/20 transition">
              <Icon name="MapPin" size={14} /> 地圖

    /* ---------- 交通方塊（垂直堆疊 · 可拖曳排序 · 多段獨立節點） ---------- */
    function TransportBlock({ transports, onAdd, onEdit, onRemove, onReorder }) {
      const list = transports || [];
      const [dragIdx, setDragIdx] = useState(null);
      const [overIdx, setOverIdx] = useState(null);

      const handleDrop = (e, toIdx) => {
        // 以 dataTransfer 攜帶來源索引，較不依賴尚未 commit 的 state（穩健）
        let from = dragIdx;
        const dt = parseInt((e.dataTransfer && e.dataTransfer.getData('text/plain')) || '', 10);
        if (!isNaN(dt)) from = dt;
        if (from != null && from !== toIdx) onReorder(from, toIdx);
        setDragIdx(null); setOverIdx(null);
      };

      return (
        <div className="grid grid-cols-[20px_1fr] gap-3">
          <div className="relative flex justify-center">
            <span className="absolute inset-y-0 w-px bg-sand-300" />
          </div>
          <div className="py-1.5 space-y-1.5">
            {list.map((tr, i) => (
              <div key={tr.id}
                draggable
                onDragStart={(e)=>{ setDragIdx(i); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', String(i)); }catch(_){} }}
                onDragOver={(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; if(overIdx!==i) setOverIdx(i); }}
                onDrop={(e)=>{ e.preventDefault(); handleDrop(e, i); }}
                onDragEnd={()=>{ setDragIdx(null); setOverIdx(null); }}
                className={"flex items-center gap-2 rounded-xl border bg-sand-100 pl-1.5 pr-1 py-1.5 text-[12.5px] text-ink-600 shadow-sm transition " +
                  (dragIdx===i ? "opacity-40 scale-[0.99] " : "") +
                  (overIdx===i && dragIdx!=null && dragIdx!==i ? "border-sage-400 ring-2 ring-sage-400/40 " : "border-sand-300 ")}>
                <span className="cursor-grab active:cursor-grabbing text-ink-500/40 shrink-0" title="按住拖曳可排序">
                  <Icon name="GripVertical" size={15} />
                </span>
                <Icon name={transportIcon(tr.mode)} size={15} strokeWidth={2} className="text-sage-600 shrink-0" />
                <div className="flex-1 min-w-0">
                  <span className="font-medium">{tr.mode}</span>
                  <span className="mx-1 text-sand-300">·</span>
                  <span>{tr.duration}</span>
                </div>
                <button type="button" onClick={()=>onEdit(tr)} title="編輯交通"
                  className="p-1 text-ink-500/50 hover:text-sage-700 rounded transition"><Icon name="Pencil" size={13} /></button>
                <button type="button" onClick={()=>onRemove(tr.id)} title="刪除交通"
                  className="p-1 text-ink-500/50 hover:text-clay-500 rounded transition"><Icon name="Trash2" size={13} /></button>
              </div>
            ))}
            <button type="button" onClick={onAdd}
              className="inline-flex items-center gap-1 rounded-full border border-dashed border-sand-300 px-2.5 py-1 text-[11.5px] text-ink-500 hover:text-sage-700 hover:border-sage-400 hover:bg-sand-50 transition">
              <Icon name="Plus" size={12} strokeWidth={2.4} /> 新增交通
            </button>
          </div>
        </div>
      );
    }

    /* ---------- 交通 新增／編輯 彈窗 ---------- */
    function TransportModal({ initial, onClose, onSave }) {
      const isEdit = !!initial;
      const parseDur = (str) => {
        const m = (str || '').match(/(\d+(?:\.\d+)?)\s*(小時|分鐘)/);
        return m ? { value: m[1], unit: m[2] } : { value: '', unit: '分鐘' };
      };
      const initDur = parseDur(initial ? initial.duration : '');
      const [mode, setMode] = useState(initial ? initial.mode : '步行');
      const [durValue, setDurValue] = useState(initDur.value);
      const [durUnit, setDurUnit] = useState(initDur.unit);
      const [error, setError] = useState('');

      const submit = (e) => {
        e.preventDefault();
        if (!mode) { setError('請選擇交通方式'); return; }
        const duration = durValue !== '' ? `${durValue} ${durUnit}` : '—';
        onSave({ mode, duration });
      };

      const inputCls = "w-full rounded-xl border border-sand-200 bg-sand-50/50 px-3.5 py-2.5 text-sm text-ink-800 placeholder:text-ink-500/50 focus:outline-none focus:ring-2 focus:ring-sage-400/40 focus:border-sage-400 transition";

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="absolute inset-0 bg-ink-800/25 backdrop-blur-[2px]" />
          <form onClick={e=>e.stopPropagation()} onSubmit={submit}
            className="relative w-full max-w-sm rounded-3xl border border-sand-200 bg-white shadow-soft p-6 pop-in">
            <div className="flex items-start justify-between mb-4">
              <div className="flex items-center gap-2 text-ink-800 font-medium">
                <Icon name={transportIcon(mode)} size={18} className="text-sage-600" /> {isEdit ? '編輯交通' : '新增交通'}
              </div>
              <button type="button" onClick={onClose} className="text-ink-500 hover:text-ink-700 p-1 -mr-1">
                <Icon name="X" size={18} />
              </button>
            </div>

            <label className="block text-[12px] text-ink-500 mb-2">交通方式</label>
            <div className="flex flex-wrap gap-2">
              {TRANSPORT_KEYS.map(m => {
                const on = mode === m;
                return (
                  <button type="button" key={m} onClick={()=>setMode(m)}
                    className={"inline-flex items-center gap-1 rounded-full border px-3 py-1.5 text-[12px] transition " +
                      (on ? "bg-sage-600 border-sage-600 text-white" : "bg-white border-sand-300 text-ink-600 hover:bg-sand-100")}>
                    <Icon name={transportIcon(m)} size={13} strokeWidth={2} /> {m}
                  </button>
                );
              })}
            </div>

            <div className="mt-4">
              <label className="block text-[12px] text-ink-500 mb-1.5">預估移動時間</label>
              <div className="flex gap-2">
                <input type="number" min="0" step="1" className={inputCls} value={durValue}
                  onChange={e=>setDurValue(e.target.value)} placeholder="數值，如 15" autoFocus />
                <select className={"w-24 shrink-0 " + inputCls} value={durUnit} onChange={e=>setDurUnit(e.target.value)}>
                  <option value="分鐘">分鐘</option>
                  <option value="小時">小時</option>
                </select>
              </div>
            </div>

            {error && (
              <div className="mt-3 flex items-center gap-1.5 rounded-xl bg-clay-400/10 border border-clay-400/30 px-3 py-2 text-[12.5px] text-clay-500">
                <Icon name="TriangleAlert" size={14} className="shrink-0" /> {error}
              </div>
            )}

            <div className="mt-6 flex gap-2">
              <button type="button" onClick={onClose}
                className="flex-1 rounded-xl border border-sand-300 bg-white text-ink-600 text-sm font-medium py-2.5 hover:bg-sand-100 transition">
                取消
              </button>
              <button type="submit"
                className="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-sage-600 hover:bg-sage-700 active:scale-[0.99] text-white text-sm font-medium py-2.5 transition">
                <Icon name={isEdit ? 'Check' : 'Plus'} size={16} strokeWidth={2.2} /> {isEdit ? '儲存變更' : '加入交通'}
              </button>
            </div>
          </form>
        </div>
      );
    }

    /* ---------- 行程 新增／編輯 彈窗 ---------- */

              <div className="flex items-center gap-2 text-ink-800 font-medium">

            <div className="mt-3">

            <div className="mt-3">
              <label className="block text-[12px] text-ink-500 mb-1.5">Google Maps 連結 / 地點名稱（選填）</label>
              <div className="relative">
                <Icon name="MapPin" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-500/50" />
                <input className={inputCls + " pl-9"} value={form.map} onChange={e=>set('map', e.target.value)}
                  placeholder="貼上地圖網址，或輸入地點名稱" />
              </div>
            </div>
            <p className="mt-2 text-[11.5px] text-ink-500/70">交通方式已改為卡片間的獨立節點，請於時間軸上以「新增交通」管理。</p>

            <div className="mt-6 flex gap-2">
              <button type="button" onClick={onClose}
                className="flex-1 rounded-xl border border-sand-300 bg-white text-ink-600 text-sm font-medium py-2.5 hover:bg-sand-100 transition">
                取消
              </button>
              <button type="submit"
                className="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-sage-600 hover:bg-sage-700 active:scale-[0.99] text-white text-sm font-medium py-2.5 transition">
                <Icon name={isEdit ? 'Check' : 'Plus'} size={16} strokeWidth={2.2} /> {isEdit ? '儲存變更' : '加入行程'}
              </button>
            </div>
          </form>
        </div>
      );
    }

    /* ---------- 橫向日期選單（Day 0–13） ---------- */
    function DateTabs({ days, activeId, onSelect, onAddDay }) {
      return (
        <div className="scroll-x -mx-1 flex gap-2.5 overflow-x-auto px-1 pb-2">
          {days.map((d, i) => {

                <div className={"text-[10px] font-medium tracking-wide " + (active ? "text-white/75" : "text-sage-600")}>DAY {i}</div>
                <div className="mt-0.5 font-semibold leading-tight">{d.date}</div>

          <button onClick={onAddDay}
            className="shrink-0 w-[96px] rounded-2xl border border-dashed border-sand-300 text-ink-500 hover:text-sage-700 hover:border-sage-400 hover:bg-sand-50 transition flex flex-col items-center justify-center gap-1 py-3">

    /* ---------- 單日行程面板 ---------- */
    function DayDetail({ day, index, onAddItem, onEditItem, onRemoveItem, onReorder,
                         onAddTransport, onEditTransport, onRemoveTransport, onReorderTransport }) {
      const wx = useDayWeather(day);
      const [dragIdx, setDragIdx] = useState(null);
      const [overIdx, setOverIdx] = useState(null);

      const handleDrop = (e, toIdx) => {
        // 優先由 dataTransfer 取得來源索引（不依賴尚未 commit 的 state，較穩健）
        let from = dragIdx;
        const dt = parseInt((e.dataTransfer && e.dataTransfer.getData('text/plain')) || '', 10);
        if (!isNaN(dt)) from = dt;
        if (from != null && from !== toIdx) onReorder(day.id, from, toIdx);
        setDragIdx(null); setOverIdx(null);

      return (
        <div className="fade-in rounded-3xl border border-sand-200 bg-white shadow-soft p-5 sm:p-6">
          {/* 標頭 */}
          <div>
            <div className="text-[11px] font-medium tracking-wide text-sage-600">DAY {index} · {day.date}（{day.weekday}）</div>
            <div className="mt-1 flex items-center gap-2 text-lg font-semibold text-ink-800">
              <Icon name="MapPin" size={18} className="text-oat-500" />
              <span>{day.city}</span>
            </div>
          </div>

          {/* 住宿資訊（顯眼呈現，含 Google Maps 連結） */}
          <div className="mt-4"><LodgingCard day={day} /></div>

          {/* 天氣（Open-Meteo 即時 / 靜態 fallback） */}
          <div className="mt-3"><WeatherBadge weather={wx} loading={wx.loading} source={wx.source} /></div>

          {/* 時間軸 */}
          <div className="mt-5">
            {day.items.length === 0 && (
              <div className="rounded-2xl border border-dashed border-sand-300 py-8 text-center text-sm text-ink-500">
                這天還沒有行程，點下方按鈕新增第一個景點。
              </div>
            )}

            {day.items.map((it, i) => (
              <React.Fragment key={it.id}>
                {/* 交通方塊（可多段獨立節點）：顯示於前一張卡片與本卡片之間 */}
                <TransportBlock
                  transports={it.transports}
                  onAdd={()=>onAddTransport(day.id, it.id)}
                  onEdit={(tr)=>onEditTransport(day.id, it.id, tr)}
                  onRemove={(trId)=>onRemoveTransport(day.id, it.id, trId)}
                  onReorder={(from, to)=>onReorderTransport(day.id, it.id, from, to)}
                />

                <div
                  draggable
                  onDragStart={(e)=>{ setDragIdx(i); e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain', String(i)); }catch(_){} }}
                  onDragOver={(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; if(overIdx!==i) setOverIdx(i); }}
                  onDrop={(e)=>{ e.preventDefault(); handleDrop(e, i); }}
                  onDragEnd={()=>{ setDragIdx(null); setOverIdx(null); }}
                  className={"group grid grid-cols-[20px_1fr] gap-3 transition " + (dragIdx===i ? "opacity-40" : "")}>
                  {/* 左側時間軸與節點 */}
                  <div className="relative flex justify-center">
                    <span className="absolute inset-y-0 w-px bg-sand-300" />
                    <span className="relative z-10 mt-1.5 h-3.5 w-3.5 rounded-full bg-white border-2 border-sage-500" />

                    </div>
                    <div className={"mt-1 rounded-2xl border bg-sand-50/50 p-4 transition " +
                      (overIdx===i && dragIdx!=null && dragIdx!==i ? "border-sage-400 ring-2 ring-sage-400/40" : "border-sand-200")}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-start gap-2 min-w-0">

                            <Icon name="GripVertical" size={16} />
                          </span>
                          <div className="font-medium text-ink-800">{it.title}</div>

                          <button onClick={()=>onRemoveItem(day.id, it.id)}

          <button onClick={()=>onAddItem(day.id)}
            className="mt-1 w-full inline-flex items-center justify-center gap-2 rounded-2xl border border-dashed border-sand-300 py-3 text-sm text-ink-600 hover:text-sage-700 hover:border-sage-400 hover:bg-sand-50 transition">
            <Icon name="Plus" size={16} strokeWidth={2.2} /> 新增行程

    function ItineraryView() {
      const [days, setDays] = usePersistentState(LS_KEYS.days, seedDays);
      // 由 localStorage 載入後，將 uid 計數器推進到大於所有既有 id，避免新資料 id 撞號
      useMemo(() => {
        let max = _uid;
        days.forEach(d => {
          if (typeof d.id === 'number') max = Math.max(max, d.id);
          d.items.forEach(it => { if (typeof it.id === 'number') max = Math.max(max, it.id); });
        });
        _uid = max;
      }, []);
      const [activeId, setActiveId] = useState(() => (days[1] ? days[1].id : (days[0] ? days[0].id : null)));
      // modal 狀態：null=關閉；{ dayId, item }（item 為 null 代表新增）
      const [modal, setModal] = useState(null);
      const [transportModal, setTransportModal] = useState(null);

      const active = days.find(d => d.id === activeId) || days[0] || null;
      const activeIndex = active ? days.findIndex(d => d.id === active.id) : -1;

      const addItem = (dayId, item) => {
        setDays(ds => ds.map(d => d.id === dayId
          ? { ...d, items: [...d.items, { id: uid(), transports: [], ...item }] }
          : d));
        setModal(null);
      };

      // 交通節點 CRUD（transportModal：{ dayId, itemId, tr }，tr 為 null 代表新增）
      const removeTransport = (dayId, itemId, trId) => {
        setDays(ds => ds.map(d => d.id !== dayId ? d : {
          ...d, items: d.items.map(it => it.id !== itemId ? it : {
            ...it, transports: (it.transports || []).filter(x => x.id !== trId),
          }),
        }));
      };
      const reorderTransport = (dayId, itemId, from, to) => {
        setDays(ds => ds.map(d => d.id !== dayId ? d : {
          ...d, items: d.items.map(it => {
            if (it.id !== itemId) return it;
            const list = [...(it.transports || [])];
            if (from < 0 || from >= list.length || to < 0 || to >= list.length) return it;
            const [moved] = list.splice(from, 1);
            list.splice(to, 0, moved);
            return { ...it, transports: list };
          }),
        }));
      };
      const saveTransport = (dayId, itemId, tr, values) => {
        setDays(ds => ds.map(d => d.id !== dayId ? d : {
          ...d, items: d.items.map(it => {
            if (it.id !== itemId) return it;
            const list = it.transports || [];
            return {
              ...it,
              transports: tr
                ? list.map(x => x.id === tr.id ? { ...x, ...values } : x)
                : [...list, { id: uid(), ...values }],
            };
          }),
        }));
        setTransportModal(null);

      const updateItem = (dayId, itemId, patch) => {
        setDays(ds => ds.map(d => d.id === dayId

          : d));
        setModal(null);
      };

      const removeItem = (dayId, itemId) => {
        setDays(ds => ds.map(d => d.id === dayId

          : d));
      };

      // 拖曳排序：將 from 位置的行程移動到 to 位置（會自動經由 usePersistentState 寫入 localStorage）
      const reorderItems = (dayId, from, to) => {

          if (from < 0 || from >= items.length || to < 0 || to >= items.length) return d;

              onAddTransport={(dayId, itemId)=>setTransportModal({ dayId, itemId, tr: null })}

          {transportModal && (
            <TransportModal

    /* ---------- 記帳：常數與工具 ---------- */
    const EXCHANGE_RATE = 35;                 // 預設匯率：1 EUR = 35 TWD
    const PAYMENTS = ['信用卡', '現金'];
    const PAYERS = ['Sandy', 'Jason'];
    const FOR_WHOM = ['Sandy', 'Jason', '共同'];
    const SPLIT_META = {
      'Sandy': { label:'Sandy 個人', color:'#8C9C84' }, // sage
      'Jason': { label:'Jason 個人', color:'#B8997A' }, // oat
      '共同':  { label:'共同消費',   color:'#B4826F' }, // clay
    };
    const twdMoney = (n) => 'NT$' + Math.round(n).toLocaleString('zh-TW');
    // 計算單筆的有效歐元 / 台幣金額（未填的幣別自動依匯率換算）
    function effAmounts(e) {
      const eurV = (e.eur === '' || e.eur == null) ? null : Number(e.eur);
      const twdV = (e.twd === '' || e.twd == null) ? null : Number(e.twd);
      const eur = eurV != null ? eurV : (twdV != null ? twdV / EXCHANGE_RATE : 0);
      const twd = twdV != null ? twdV : (eurV != null ? eurV * EXCHANGE_RATE : 0);
      return { eur, twd, eurEntered: eurV != null, twdEntered: twdV != null };
    }
    // 由行程資料（localStorage 或 seed）取出所有有效日期，供下拉選單使用
    function getTripDates() {
      const stored = loadLS(LS_KEYS.days);
      const src = Array.isArray(stored) && stored.length ? stored : ITINERARY;
      // 保留原始 Day 序號（0-based）作為標籤前綴，例如「DAY 0 · 12/07（一）」
      return src
        .map((d, i) => ({ value: d.date, weekday: d.weekday, dayNo: i, valid: isMMDD(d.date) }))
        .filter(x => x.valid)
        .map(x => ({ value: x.value, label: `DAY ${x.dayNo} · ${x.value}（${x.weekday}）` }));
    }
    function defaultExpenseDate(dates) {
      try {
        const d = new Date();
        const today = String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
        if (dates.some(x => x.value === today)) return today;
      } catch (e) {}
      return dates[0] ? dates[0].value : '';
    }

    /* ---------- AA 拆帳結算 ----------
       共同消費：兩人各分攤 50%；指定對象：該對象全額負擔；付款人＝對象：不拆帳。
       以「實付 − 應分攤 = 淨額」推算最終抵銷結果（EUR / TWD 分別計算）。 */
    function computeSettlement(expenses) {
      const build = (cur) => {
        const paid = { Sandy: 0, Jason: 0 };
        const share = { Sandy: 0, Jason: 0 };
        expenses.forEach(e => {
          const amt = effAmounts(e)[cur];
          if (!amt) return;
          if (e.payer === 'Sandy' || e.payer === 'Jason') paid[e.payer] += amt;
          if (e.forWhom === '共同') { share.Sandy += amt / 2; share.Jason += amt / 2; }
          else if (e.forWhom === 'Sandy' || e.forWhom === 'Jason') share[e.forWhom] += amt;
        });
        const netSandy = paid.Sandy - share.Sandy;
        let settle = null;
        if (Math.abs(netSandy) >= 0.005) {
          settle = netSandy > 0
            ? { debtor: 'Jason', creditor: 'Sandy', amt: netSandy }
            : { debtor: 'Sandy', creditor: 'Jason', amt: -netSandy };
        }
        return {
          Sandy: { paid: paid.Sandy, share: share.Sandy, net: netSandy },
          Jason: { paid: paid.Jason, share: share.Jason, net: paid.Jason - share.Jason },
          settle,
        };
      };
      return { eur: build('eur'), twd: build('twd') };
    }

    /* ---------- 記帳資料匯出 CSV（含 UTF-8 BOM，Excel 中文不亂碼） ---------- */
    function exportExpensesCSV(expenses) {
      const headers = ['日期', '類別', '項目說明', '歐元金額(€)', '台幣金額(NT$)', '付款方式', '付款人', '分攤對象'];
      const esc = (v) => {
        let s = String(v == null ? '' : v);
        if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const rows = expenses.slice()
        .sort((a, b) => a.date.localeCompare(b.date) || (a.id - b.id))
        .map(e => {
          const a = effAmounts(e);
          return [e.date, e.category, e.note, a.eur.toFixed(2), Math.round(a.twd), e.payment, e.payer, e.forWhom].map(esc).join(',');
        });
      const BOM = String.fromCharCode(0xFEFF); // UTF-8 BOM，確保 Excel 開啟繁體中文不亂碼
      const csv = BOM + [headers.map(esc).join(','), ...rows].join('\r\n');
      try {
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const d = new Date();
        const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
        const a = document.createElement('a');
        a.href = url;
        a.download = `德國奧地利之旅_記帳明細_${stamp}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      } catch (err) {}
    }

            <select className={selCls} value={filters.date} onChange={e=>set('date', e.target.value)}>
              <option value="全部">全部日期</option>
              {dates.map(d => <option key={d.value} value={d.value}>{d.label}</option>)}
            </select>
            <select className={selCls} value={filters.forWhom} onChange={e=>set('forWhom', e.target.value)}>
              <option value="全部">全部消費對象</option>
              {FOR_WHOM.map(f => <option key={f} value={f}>{f}</option>)}
            </select>
            <select className={selCls} value={filters.category} onChange={e=>set('category', e.target.value)}>
              <option value="全部">全部類別</option>
              {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
      );
    }

    /* ---------- 編輯消費 彈窗 ---------- */
    function ExpenseModal({ initial, dates, onClose, onSave }) {
      const [form, setForm] = useState(() => ({
        date: initial.date,
        category: initial.category,
        note: initial.note === '（無備註）' ? '' : initial.note,
        eur: initial.eur != null ? String(initial.eur) : '',
        twd: initial.twd != null ? String(initial.twd) : '',
        payment: initial.payment, payer: initial.payer, forWhom: initial.forWhom,
      }));
      const [error, setError] = useState('');
      const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const submit = (e) => {
        e.preventDefault();
        const eurV = form.eur.trim() === '' ? null : Number(form.eur);
        const twdV = form.twd.trim() === '' ? null : Number(form.twd);
        const eurOk = eurV != null && eurV > 0;
        const twdOk = twdV != null && twdV > 0;
        if (!eurOk && !twdOk) { setError('請至少填寫「歐元」或「台幣」其中一項金額'); return; }
        onSave({
          date: form.date, category: form.category, note: form.note.trim() || '（無備註）',
          eur: eurOk ? eurV : null, twd: twdOk ? twdV : null,
          payment: form.payment, payer: form.payer, forWhom: form.forWhom,
        });
      };

      const inputCls = "w-full rounded-xl border border-sand-200 bg-sand-50/50 px-3.5 py-2.5 text-sm text-ink-800 placeholder:text-ink-500/50 focus:outline-none focus:ring-2 focus:ring-sage-400/40 focus:border-sage-400 transition";

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="absolute inset-0 bg-ink-800/25 backdrop-blur-[2px]" />
          <form onClick={e=>e.stopPropagation()} onSubmit={submit}
            className="relative w-full max-w-md rounded-3xl border border-sand-200 bg-white shadow-soft p-6 pop-in max-h-[90vh] overflow-y-auto">
            <div className="flex items-start justify-between mb-4">
              <div className="flex items-center gap-2 text-ink-800 font-medium">
                <Icon name="Pencil" size={18} className="text-sage-600" /> 編輯消費
              </div>
              <button type="button" onClick={onClose} className="text-ink-500 hover:text-ink-700 p-1 -mr-1">
                <Icon name="X" size={18} />
              </button>
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-[12px] text-ink-500 mb-1.5">日期</label>
                <select className={inputCls} value={form.date} onChange={e=>set('date', e.target.value)}>
                  {dates.map(d => <option key={d.value} value={d.value}>{d.label}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[12px] text-ink-500 mb-1.5">類別</label>
                <select className={inputCls} value={form.category} onChange={e=>set('category', e.target.value)}>
                  {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3 mt-3">
              <div>
                <label className="block text-[12px] text-ink-500 mb-1.5">歐元 (€)</label>
                <input className={inputCls} type="number" step="0.01" min="0" value={form.eur}
                  onChange={e=>set('eur', e.target.value)} placeholder="0.00" />
              </div>
              <div>
                <label className="block text-[12px] text-ink-500 mb-1.5">台幣 (NT$)</label>
                <input className={inputCls} type="number" step="1" min="0" value={form.twd}
                  onChange={e=>set('twd', e.target.value)} placeholder="0" />
              </div>
            </div>
            <p className="mt-1.5 text-[11px] text-ink-500/70">歐元、台幣二擇一必填；皆填則各自採用輸入值。</p>

            <div className="mt-4">
              <label className="block text-[12px] text-ink-500 mb-1.5">付款方式</label>
              <Segmented options={PAYMENTS} value={form.payment} onChange={v=>set('payment', v)} full />
            </div>

            <div className="grid grid-cols-2 gap-3 mt-3">
              <div>
                <label className="block text-[12px] text-ink-500 mb-1.5">付款人</label>
                <Segmented options={PAYERS} value={form.payer} onChange={v=>set('payer', v)} full />
              </div>
              <div>
                <label className="block text-[12px] text-ink-500 mb-1.5">消費對象</label>
                <Segmented options={FOR_WHOM} value={form.forWhom} onChange={v=>set('forWhom', v)} full />
              </div>
            </div>

            <div className="mt-3">
              <label className="block text-[12px] text-ink-500 mb-1.5">項目名稱 / 備註</label>
              <input className={inputCls} value={form.note} onChange={e=>set('note', e.target.value)} placeholder="消費說明…" />
            </div>

            {error && (
              <div className="mt-3 flex items-center gap-1.5 rounded-xl bg-clay-400/10 border border-clay-400/30 px-3 py-2 text-[12.5px] text-clay-500">
                <Icon name="TriangleAlert" size={14} className="shrink-0" /> {error}
              </div>
            )}

            <div className="mt-6 flex gap-2">
              <button type="button" onClick={onClose}
                className="flex-1 rounded-xl border border-sand-300 bg-white text-ink-600 text-sm font-medium py-2.5 hover:bg-sand-100 transition">
                取消
              </button>
              <button type="submit"
                className="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-sage-600 hover:bg-sage-700 active:scale-[0.99] text-white text-sm font-medium py-2.5 transition">
                <Icon name="Check" size={16} strokeWidth={2.2} /> 儲存變更
              </button>
            </div>
          </form>
        </div>
      );
    }

    /* ---------- 消費明細列表 ---------- */
    function Ledger({ expenses, onRemove, onEdit, onExport }) {
      const sub = expenses.reduce((s, e) => {
        const a = effAmounts(e); s.eur += a.eur; s.twd += a.twd; return s;
      }, { eur: 0, twd: 0 });

      return (
        <div className="rounded-3xl border border-sand-200 bg-white shadow-soft overflow-hidden">
          <div className="flex items-center justify-between px-5 sm:px-6 py-4 border-b border-sand-200">
            <div className="flex items-center gap-2 text-ink-800 font-medium">
              <Icon name="ReceiptText" size={18} className="text-sage-600" /> 消費明細
            </div>
            <div className="flex items-center gap-2.5">
              <button type="button" onClick={onExport}
                className="inline-flex items-center gap-1.5 rounded-lg border border-sand-300 bg-white px-3 py-1.5 text-[12px] text-ink-600 hover:text-sage-700 hover:border-sage-400 transition"
                title="匯出所有記帳資料為 CSV">
                <Icon name="Download" size={14} /> 匯出 CSV
              </button>
              <span className="text-[13px] text-ink-500">{expenses.length} 筆</span>
            </div>
          </div>

          <div className="divide-y divide-sand-100">
            {expenses.length === 0 && (
              <div className="px-6 py-10 text-center text-ink-500 text-sm">沒有符合篩選條件的消費紀錄。</div>
            )}
            {expenses.map(e => {
              const c = CATEGORIES[e.category] || CATEGORIES['其他'];
              const a = effAmounts(e);
              return (
                <div key={e.id} className="group flex items-center gap-3 px-5 sm:px-6 py-3.5 hover:bg-sand-50/60 transition">
                  <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
                    style={{ background:c.bg, color:c.color }}>
                    <Icon name={c.icon} size={18} strokeWidth={2} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-sm text-ink-800 truncate">{e.note}</div>
                    <div className="text-[12px] text-ink-500 flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-0.5">
                      <span className="inline-flex items-center gap-1"><Icon name="Calendar" size={12} />{e.date}</span>
                      <span className="text-sand-300">·</span>
                      <span>{e.category}</span>
                      <span className="text-sand-300">·</span>
                      <span className="inline-flex items-center gap-1">
                        <Icon name="User" size={12} className="text-sage-600" />{e.payer} → {e.forWhom}
                      </span>
                      <span className="inline-flex items-center gap-1 rounded-full bg-sand-100 border border-sand-200 px-2 py-0.5 text-[11px]">
                        <Icon name={e.payment === '現金' ? 'Banknote' : 'CreditCard'} size={11} />{e.payment}
                      </span>
                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="text-sm font-medium text-ink-800 tabular-nums">{a.eurEntered ? '' : '≈'}{money(a.eur)}</div>
                    <div className="text-[12px] text-ink-500 tabular-nums">{a.twdEntered ? '' : '≈'}{twdMoney(a.twd)}</div>
                  </div>
                  <div className="ml-1 flex items-center gap-0.5 shrink-0">
                    <button onClick={()=>onEdit(e)}
                      className="text-ink-500/50 hover:text-sage-700 hover:bg-sand-100 rounded-lg p-1.5 transition"
                      title="編輯">
                      <Icon name="Pencil" size={15} />
                    </button>
                    <button onClick={()=>onRemove(e.id)}
                      className="text-ink-500/50 hover:text-clay-500 hover:bg-sand-100 rounded-lg p-1.5 transition"
                      title="刪除">
                      <Icon name="Trash2" size={15} />
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {expenses.length > 0 && (
            <div className="flex items-center justify-between px-6 py-4 bg-sand-50/60 border-t border-sand-200">
              <span className="text-sm text-ink-600">小計</span>
              <div className="text-right">
                <div className="text-base font-semibold text-ink-800 tabular-nums">{money(sub.eur)}</div>
                <div className="text-[12px] text-ink-500 tabular-nums">≈ {twdMoney(sub.twd)}</div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ExpensesView() {
      const [expenses, setExpenses] = usePersistentState(LS_KEYS.expenses, INIT_EXPENSES);
      const [filters, setFilters] = useState({ date: '全部', forWhom: '全部', category: '全部' });
      const [editing, setEditing] = useState(null); // 正在編輯的消費（null 為關閉）
      const dates = useMemo(() => getTripDates(), []);

      const add = (e) => setExpenses(list => [e, ...list]);
      const remove = (id) => setExpenses(list => list.filter(x => x.id !== id));
      const update = (id, patch) => setExpenses(list => list.map(x => x.id === id ? { ...x, ...patch } : x));

      const filtered = useMemo(() => {
        return expenses
          .filter(e =>
            (filters.date === '全部' || e.date === filters.date) &&
            (filters.forWhom === '全部' || e.forWhom === filters.forWhom) &&
            (filters.category === '全部' || e.category === filters.category))
          .slice()
          .sort((a, b) => a.date.localeCompare(b.date) || (a.id - b.id));
      }, [expenses, filters]);

      return (
        <div className="space-y-4">
          {/* 總花費（雙幣別 + 分攤進度條） */}
          <SummaryCard expenses={expenses} />
          {/* AA 拆帳結算 */}
          <SettlementCard expenses={expenses} />
          {/* 新增消費（置於上方，方便快速輸入） */}
          <AddExpenseForm onAdd={add} dates={dates} />
          {/* 篩選 + 明細列表（置於下方） */}
          <FilterBar filters={filters} setFilters={setFilters} dates={dates} />
          <Ledger expenses={filtered} onRemove={remove} onEdit={setEditing} onExport={()=>exportExpensesCSV(expenses)} />

          {editing && (
            <ExpenseModal
              initial={editing}
              dates={dates}
              onClose={()=>setEditing(null)}
              onSave={(patch)=>{ update(editing.id, patch); setEditing(null); }}
            />
          )}
        </div>
      );
    }

    /* ---------- 主框架 ---------- */
    function App() {
      const [tab, setTab] = useState('itinerary');
      const tabs = [
        { key:'itinerary', label:'行程總覽', icon:'CalendarDays' },
        { key:'expenses',  label:'旅遊記帳', icon:'Wallet' },
      ];
      return (
        <div className="min-h-full">
          <div className="mx-auto max-w-3xl px-4 sm:px-6 py-8 sm:py-10">
            <header className="mb-7">
              <div className="flex items-center gap-2 text-sage-600 text-[13px] font-medium">
                <Icon name="Plane" size={15} /> TRAVEL PLANNER
              </div>
              <h1 className="mt-2 text-2xl sm:text-3xl font-semibold text-ink-800 tracking-tight">{TRIP.title}</h1>
              <div className="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-[13.5px] text-ink-500">
                <span className="inline-flex items-center gap-1.5"><Icon name="MapPin" size={14} className="text-oat-500"/>{TRIP.subtitle}</span>
                <span className="inline-flex items-center gap-1.5"><Icon name="Calendar" size={14} className="text-oat-500"/>{TRIP.dateRange}</span>
              </div>
            </header>

            <div className="inline-flex items-center gap-1 rounded-2xl border border-sand-200 bg-white p-1 shadow-soft mb-6">
              {tabs.map(t => {
                const active = tab === t.key;
                return (
                  <button key={t.key} onClick={()=>setTab(t.key)}
                    className={"inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium transition " +
                      (active ? "bg-sage-600 text-white shadow-sm" : "text-ink-600 hover:bg-sand-100")}>
                    <Icon name={t.icon} size={16} /> {t.label}
                  </button>
                );
              })}
            </div>

            <main key={tab} className="fade-in">
              {tab === 'itinerary' ? <ItineraryView /> : <ExpensesView />}
            </main>

            <footer className="mt-10 flex flex-col items-center gap-3">
              <button onClick={resetAllData}
                className="inline-flex items-center gap-1.5 rounded-xl border border-sand-300 bg-white px-3.5 py-2 text-[12.5px] text-ink-500 hover:text-clay-500 hover:border-clay-400 transition">
                <Icon name="RotateCcw" size={14} /> 重設示範資料
              </button>
              <div className="text-center text-[12px] text-ink-500/70">
                <span className="inline-flex items-center gap-1"><Icon name="Save" size={12} /> 資料自動儲存於本機瀏覽器</span>
                <span className="mx-1.5 text-sand-300">·</span>
                <span className="inline-flex items-center gap-1"><Icon name="CloudSun" size={12} /> 天氣由 Open-Meteo 提供</span>
              </div>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- 以 classic runtime 手動轉譯並執行（避免 automatic runtime 產生 import 導致失敗） -->
  <script>
    (function () {
      var src = document.getElementById('app-src').textContent;
      var out = Babel.transform(src, {
        presets: [['react', { runtime: 'classic' }]],
      }).code;
      (0, eval)(out);
    })();
  </script>

  <!-- ===== PWA：註冊 Service Worker（離線快取；需以 http(s) 或 localhost 開啟） ===== -->
  <script>
    (function () {
      // Service Worker 僅在安全來源（https / localhost）與 http(s) 下可用；file:// 會自動略過
      if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {/* 略過失敗，不影響使用 */});
        });
      }
    })();
  </script>
</body>
</html>
